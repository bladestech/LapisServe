name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "e.g. OnePlus Nord CE 3 Lite, Android 15"
    validations: { required: true }
  - type: dropdown
    id: server
    attributes:
      label: Server software
      options: [Vanilla, Paper, Purpur, Pumpkin, Not server related]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Server and app version
      placeholder: "e.g. Paper 1.21.8, LapisServe 0.1.0"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Console log
      description: Console tab, Share log. Remove anything private first.
      render: text
