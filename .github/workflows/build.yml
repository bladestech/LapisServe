name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lapisserve-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LAPIS_KEYSTORE_PASSWORD: ${{ secrets.LAPIS_KEYSTORE_PASSWORD }}
      LAPIS_KEY_ALIAS: ${{ secrets.LAPIS_KEY_ALIAS }}
      LAPIS_KEY_PASSWORD: ${{ secrets.LAPIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        run: |
          echo "${{ secrets.LAPIS_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LAPIS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name APK and write checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/LapisServe-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "LapisServe-${GITHUB_REF_NAME}.apk" > "LapisServe-${GITHUB_REF_NAME}.apk.sha256")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "LapisServe $GITHUB_REF_NAME"
